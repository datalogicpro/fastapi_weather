repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.0
    hooks:
      - id: uv-lock

  # Every check runs from the project's .venv through uv, so it uses the
  # versions in uv.lock, and Windows Smart App Control doesn't block it
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run python -m pre_commit_hooks.trailing_whitespace_fixer
        language: system
        types: [text]

      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run python -m pre_commit_hooks.end_of_file_fixer
        language: system
        types: [text]

      - id: check-yaml
        name: check yaml
        entry: uv run python -m pre_commit_hooks.check_yaml
        language: system
        types: [yaml]

      - id: check-toml
        name: check toml
        entry: uv run python -m pre_commit_hooks.check_toml
        language: system
        types: [toml]

      - id: check-merge-conflict
        name: check for merge conflicts
        entry: uv run python -m pre_commit_hooks.check_merge_conflict
        language: system
        types: [text]

      - id: check-added-large-files
        name: check for added large files
        entry: uv run python -m pre_commit_hooks.check_added_large_files
        language: system

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run python -m mypy .
        language: system
        types: [python]
        pass_filenames: false
