   version: 2
   updates:
     - package-ecosystem: "uv"
       directory: "/"
       schedule:
         interval: "weekly"

     - package-ecosystem: "github-actions"
       directory: "/"
       schedule:
         interval: "weekly"

     - package-ecosystem: "docker"
       directory: "/"
       schedule:
         interval: "weekly"
       ignore:
         # Stay on Python 3.13 until a planned upgrade of the whole project
         - dependency-name: "python"
           update-types: ["version-update:semver-major", "version-update:semver-minor"]
